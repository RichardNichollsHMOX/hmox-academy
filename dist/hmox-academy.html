<title>HMO X Academy</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap">
<style>
/* HMO X brand: teal #4DE3BD, off-black #282829, accent green #0C886B, white; pastels for backgrounds only.
   Layout: one reading column; home = progress + module ladder, module = lesson then quiz, team = sign-off register. */
:root{
  --ink:#282829; --ink-2:#55575b; --ink-3:#85878c;
  --bg:#ffffff; --panel:#e2fbe1; --line:#e6ece9;
  --mint:#e2fbe1; --sky:#d9e8f0; --butter:#fcf9d2;
  --teal:#4DE3BD; --teal-ink:#0b2a22; --teal-deep:#0C886B; --teal-dark:#0a5444;
  --good:#127a4f; --good-bg:#e3f5ec; --warn:#8a5a00; --warn-bg:#fdf1d8; --bad:#b3261e; --bad-bg:#fbe6e4;
  --hero:#ffffff; --hero-fg:#282829; --hero-dim:#55575b;
  --display:"Plus Jakarta Sans",ui-sans-serif,system-ui,sans-serif;
  --body:"Open Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55}
*{box-sizing:border-box}
h1,h2,h3{font-family:var(--display);font-weight:800;letter-spacing:-.02em;text-wrap:balance;margin:0;line-height:1.15}
p{margin:0}
a{color:var(--teal-deep)}
button{font:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,label:focus-within{outline:3px solid var(--teal);outline-offset:2px}
.wrap{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top band */
.band{background:var(--hero);color:var(--hero-fg);border-bottom:1px solid var(--line);margin-top:calc(-1 * env(safe-area-inset-top,0px));padding-top:env(safe-area-inset-top,0px)}
.band .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;color:var(--hero-fg);text-decoration:none}
.mark{width:30px;height:30px;border-radius:8px;background:var(--teal);display:grid;place-items:center;flex:none}
.mark i{width:12px;height:12px;border-radius:3px;background:var(--teal);display:block}
.brand b{font-family:var(--display);font-size:19px;letter-spacing:-.01em}
.brand .x{color:var(--teal-deep)}
.brand .acad{color:var(--hero-dim);font-weight:600}
.tabs{display:flex;gap:4px}
.tabs a{color:var(--hero-dim);text-decoration:none;font-weight:600;font-size:14px;padding:7px 12px;border-radius:999px}
.tabs a[aria-current="page"]{background:var(--mint);color:var(--teal-dark)}

main{padding-block:28px 64px;display:grid;gap:28px}
.notice{background:var(--butter);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:14px;color:var(--ink-2)}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--teal-deep)}
.muted{color:var(--ink-2)}
.small{font-size:14px}

/* summary */
.summary{display:grid;gap:18px;position:relative;overflow:hidden;background:var(--mint);border-radius:24px;padding:28px 24px}
.summary:after{content:"";position:absolute;right:-70px;top:-70px;width:140px;height:140px;background:var(--teal);opacity:.35;transform:rotate(45deg);pointer-events:none}
.summary>*{position:relative;z-index:1}
.summary .eyebrow{color:var(--teal-dark)}
.summary h1{font-size:clamp(28px,5vw,40px)}
.meter{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px}
.meter i{height:10px;border-radius:3px;background:#ffffff;display:block}
.meter i.on{background:var(--teal)}
.stage{display:grid;gap:10px;background:var(--butter);border-radius:20px;padding:18px}
.stage h2{font-size:20px}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:0;padding:0;list-style:none}
.steps li{border-top:3px solid #c9dcd3;background:#ffffff;border-radius:0 0 14px 14px;padding:10px 12px;font-size:14px;color:var(--ink-2);min-width:0}
.steps li b{display:block;color:var(--ink);font-size:14px}
.steps li.done{border-color:var(--teal)}
.steps li.now{border-color:var(--ink)}
@media(max-width:520px){.steps{grid-template-columns:1fr}}

/* module list */
.mods{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.mods li{border:1px solid var(--line);border-radius:16px;background:#ffffff}
.mods li:hover{background:#f6fdf6}
.mods a{display:grid;grid-template-columns:2.6em 1fr auto;gap:12px;align-items:center;padding:12px 14px;color:inherit;text-decoration:none}
.mods a:hover .t{color:var(--teal-deep)}
.mods .n{font-family:var(--display);font-weight:800;color:var(--teal-dark);font-variant-numeric:tabular-nums;background:var(--mint);border-radius:12px;width:2.6em;height:2.6em;display:grid;place-items:center;font-size:14px}
.mods li:nth-child(3n+2) .n{background:var(--sky);color:#24506a}
.mods li:nth-child(3n) .n{background:var(--butter);color:#6b5b00}
.mods .t{font-weight:600;display:block}
.mods .s{font-size:14px;color:var(--ink-2);display:block}
.mods .txt{min-width:0}
.chip{font-size:12px;font-weight:700;padding:4px 9px;border-radius:999px;white-space:nowrap;background:var(--panel);color:var(--ink-2)}
.chip.good{background:var(--good-bg);color:var(--good)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.bad{background:var(--bad-bg);color:var(--bad)}
.chip.ink{background:var(--ink);color:var(--bg)}

/* lesson */
.lesson{display:grid;gap:26px}
.lesson header{display:grid;gap:10px;background:var(--mint);border-radius:24px;padding:24px}
.lesson header .eyebrow{color:var(--teal-dark)}
.lesson header h1{font-size:clamp(28px,5vw,38px)}
.back{font-size:14px;font-weight:600;text-decoration:none}
.sec{display:grid;gap:10px;max-width:68ch}
.sec h2{font-size:21px}
.sec ul{margin:0;padding-left:1.2em;display:grid;gap:6px}
dl.terms{margin:0;display:grid;gap:0;border-top:1px solid var(--line)}
dl.terms div{display:grid;grid-template-columns:minmax(0,13em) 1fr;gap:14px;padding:10px 0;border-bottom:1px solid var(--line)}
dl.terms dt{font-weight:700}
dl.terms dd{margin:0;color:var(--ink-2)}
@media(max-width:560px){dl.terms div{grid-template-columns:1fr;gap:2px}}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
td{font-variant-numeric:tabular-nums}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.card:nth-child(3n+2){background:var(--sky)}
.card:nth-child(3n){background:var(--butter)}
.card{background:var(--mint);border-radius:20px;padding:14px;display:grid;gap:4px;align-content:start}
.card b{font-family:var(--display);font-size:18px}
.card .role{font-size:13px;font-weight:600;color:var(--teal-deep)}
.confirm{border:1.5px dashed var(--warn);background:var(--warn-bg);color:var(--ink);border-radius:12px;padding:12px 14px;font-size:14px;max-width:68ch}
.confirm b{color:var(--warn)}

.cta{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.btn{border:0;border-radius:999px;padding:11px 18px;font-weight:700;background:var(--ink);color:var(--bg)}
.btn.teal{background:var(--teal);color:var(--teal-ink)}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn[disabled]{opacity:.45;cursor:not-allowed}

/* quiz */
.quiz{display:grid;gap:18px;background:var(--sky);border-radius:24px;padding:22px}
.quiz .eyebrow{color:#24506a}
.quiz h2{font-size:22px}
.q{display:grid;gap:8px;border:0;margin:0;padding:0;min-width:0}
.q legend{font-weight:700;padding:0;margin-bottom:8px}
.q legend span{color:var(--ink-3);font-family:var(--display);margin-right:6px}
.opt{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer}
.opt input{margin-top:4px;accent-color:var(--teal-deep)}
.opt:has(input:checked){border-color:var(--ink)}
.opt.right{border-color:var(--good);background:var(--good-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.why{font-size:14px;color:var(--ink-2);padding-left:2px}
.why b{color:var(--ink)}
.result{display:grid;gap:6px;border-radius:12px;padding:16px;background:var(--bg)}
.result h3{font-size:24px}
.result.pass h3{color:var(--good)}
.result.fail h3{color:var(--bad)}

/* declaration + certificate */
.declare{display:grid;gap:12px;border:1.5px solid var(--ink);border-radius:14px;padding:18px}
.declare label{font-weight:600;font-size:14px;display:grid;gap:6px}
input[type=text],textarea{font:inherit;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);width:100%}
.cert{background:var(--teal);color:var(--ink);border-radius:24px;padding:26px;display:grid;gap:10px}
.cert .eyebrow{color:var(--teal-dark)}
.cert h2{font-size:28px}
.cert p{color:var(--teal-ink)}
.cert b{color:var(--ink)}

/* team */
.team{display:grid;gap:14px}
.person{border:1px solid var(--line);background:#ffffff;border-radius:18px;padding:14px;display:grid;gap:12px}
.person-hd{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
.who{display:flex;gap:10px;align-items:center;min-width:0}
.av{width:34px;height:34px;border-radius:50%;flex:none;object-fit:cover;background:var(--panel)}
.who b{display:block}
.grid12{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.cell{font-size:13px;background:var(--panel);border-radius:8px;padding:6px 8px;display:flex;justify-content:space-between;gap:6px;min-width:0}
.cell span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cell.ok{background:var(--good-bg);color:var(--good)}
.cell.no{background:var(--bad-bg);color:var(--bad)}
.signbox{display:grid;gap:8px;background:var(--panel);border-radius:10px;padding:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
@media (prefers-reduced-motion:no-preference){.opt,.btn{transition:background .15s,border-color .15s}}
</style>

  <a class="brand" href="#"><b>HMO <span class="x">X</span> <span class="acad">Academy</span></b></a>

    <a href="#team" id="tabTeam" hidden>Team sign-off</a>
  </nav>

<script>
/*
 * HMO X Academy course content.
 * Edit this file to change lessons and questions; app.html renders it.
 *
 * A general course: an introduction to HMO X and to HMOs, for anyone joining the business,
 * whatever their role. Nothing in it is written for one person or one job.
 *
 * Module shape:
 *   id        stable id (never change once people have taken the quiz; progress is keyed on it)
 *   title, mins, summary
 *   sections  [{h, p:[paragraphs], list:[bullets], terms:[[term, meaning]], cards:[{name, role, text}], table:{head:[], rows:[[]]}}]
 *   confirm   note shown only to managers: content still to confirm with Richard
 *   questions [{q, o:[options], a:index of correct option, why}]  (options are shuffled on screen)
 *
 * Sources: the HMO X Hub lessons (Our Fundamentals, the five lens courses, the Community Calls and the
 * Renters' Rights Act series, read in full 26 Nov 2026), Richard Nicholls' market commentary 2018 to 2026,
 * hmox.co.uk (updated 25 Nov 2026), the Tier Methodology Edition 2 (Oct 2026), the HMO X template reports
 * in Drive and the Team Analyser evidence scan (13 Nov 2026). See research/ for the detail.
 */
window.HMOX_COURSE = {
  passMark: 0.8,
  refreshDays: 365,
  evidenceDate: "13 November 2026",
  modules: [

    /* ------------------------------------------------------------------ 1 */
    {
      id: "intro",
      title: "Welcome to HMO X",
      mins: 15,
      summary: "Who we are, what we stand for, how the business fits together and how this course works.",
      sections: [
        { h: "Who we are", p: [
          "HMO X makes the complex world of HMO investing accessible: a nationwide community and a full-service ecosystem for investors at every stage, from buying to running, improving, refinancing and selling.",
          "The HMO is the asset class we are built for. Not buy-to-let. Not commercial. Not serviced accommodation.",
          "Our line is “Your community of HMO experts.” You will see it on every report cover and footer."
        ]},
        { h: "The company", terms: [
          ["HMO X Ltd", "Company No. 15730822. The main business: valuations, sales, reports, consultancy and the Hub."],
          ["HMO X Auctions Ltd", "Company No. 15626888. The UK's first auction house dedicated solely to HMOs, launched in June 2025. It issues the auction-side documents."],
          ["HMO X Sales", "Our agency team for established HMOs, formerly HMO Sales Expert. 700+ HMO sales completed since 2018."],
          ["Office", "Discovery Court Business Centre, Wallisdown Road, Poole, BH12 5AG. Phone 0330 441 5888."],
          ["Websites", "hmox.co.uk is the main site. The tools run on tools.hmox.co.uk. The Hub is at mighty.hmox.co.uk."]
        ]},
        { h: "Where we came from", p: [
          "HMO X grew out of 18 years of HMO investment experience at Platinum Property Partners, which ran a franchise model for corporate professionals. HMO X turned that model around by removing the barriers to entry.",
          "Our Senior Valuer, Richard Nicholls, has 20+ years of HMO valuation experience and is the author of the Tier Methodology, the framework behind every answer we give."
        ]},
        { h: "Vision and mission", terms: [
          ["Vision", "To be the community every HMO investor turns to first, where one evidenced framework, not guesswork, guides every decision from first purchase to final exit."],
          ["Mission", "To give every HMO investor the same honest diagnosis we would want for ourselves, with the Tier Methodology at the core, whichever lens brought them to us."]
        ]},
        { h: "Our values, in priority order", list: [
          "Experts", "Approachable", "Optimistic", "Professional", "Community-driven"
        ], p: [
          "The test for every piece of work: if it could not stand up to a working valuer, surveyor, operator or solicitor, it should not leave our desk.",
          "Our standards: de-risked, documented, delivered; a plan, not information; and a partnership that continues long after completion. “Data, not opinion.”"
        ]},
        { h: "How the business fits together", terms: [
          ["Sales and auctions", "HMO X Sales (Committed Sale and bespoke sales) and HMO X Auctions."],
          ["Reports and consultancy", "Valuations, Health Checks, Exit Planning, GDV appraisals, buyer packs and Location Intelligence Reports."],
          ["Tools", "Five online tools built on our own evidence: Value My HMO, Tier Test, GDV Appraisal, Find My Next HMO and the Location Intelligence Report."],
          ["Community and education", "The HMO X Hub, free to join, with the weekly Community Call."],
          ["Specialist partners", "Planning, compliance, finance, legal and financial planning, through named partners."]
        ]},
        { h: "Five lenses on one framework", p: [
          "We look at every HMO through five lenses, because that is how investors move through this market: Buy, Operate (optimise and hold), Add value, Develop and Sell. Most investors use three or four of them over the life of a portfolio. Each is covered later in this course."
        ]},
        { h: "Five questions every conversation should answer", list: [
          "Which tier is the HMO in today?",
          "Which tier will it hold over the hold period?",
          "What does that mean for income, value and borrowing?",
          "What would it cost to move up a tier, or what is the risk of sliding?",
          "What is the right next step?"
        ]},
        { h: "Getting started", list: [
          "Join the HMO X Hub and read the Chassis (“Your Starting Point”) and the Tier Methodology module in Our Fundamentals.",
          "Download the Tier Methodology Guide from hmox.co.uk.",
          "Join a Tuesday Community Call at 7pm.",
          "Try the five tools on tools.hmox.co.uk so you know what clients see."
        ]},
        { h: "How this course works", p: [
          "There are 15 modules. Read each one, then take its quiz. You need 80% to pass, and you can retake a quiz as many times as you need. Each attempt shuffles the questions and answers.",
          "When you have passed every module, sign the declaration on your home screen. A manager then reviews your results and signs you off. Sign-off lasts 12 months, after which you take the refresher."
        ]}
      ],
      questions: [
        { q: "What is HMO X's line on every report?", o: ["Your community of HMO experts", "Where expertise drives opportunity", "Your community of property experts", "Sell your HMO with certainty"], a: 0, why: "“Your community of HMO experts.” is current. The other lines are older or not ours." },
        { q: "Which asset class is HMO X built for?", o: ["HMOs only", "HMOs and buy-to-let", "HMOs and serviced accommodation", "Any residential investment"], a: 0, why: "Not buy-to-let, not commercial, not serviced accommodation." },
        { q: "Which company issues the auction-side documents?", o: ["HMO X Auctions Ltd", "HMO X Ltd", "Essential Information Group", "Platinum Property Partners"], a: 0, why: "HMO X Auctions Ltd (No. 15626888) is the auction business. EIG is our auction platform partner." },
        { q: "Which is first in HMO X's values, in priority order?", o: ["Experts", "Community-driven", "Optimistic", "Professional"], a: 0, why: "Experts, Approachable, Optimistic, Professional, Community-driven." },
        { q: "What is the test for every piece of HMO X work?", o: ["Would it stand up to a working valuer, surveyor, operator or solicitor?", "Would the client be pleased with the number?", "Is it longer than a competitor's report?", "Has marketing approved the design?"], a: 0, why: "If it would not withstand that scrutiny, it should not leave our desk." },
        { q: "Which are HMO X's five lenses?", o: ["Buy, Operate, Add value, Develop, Sell", "North, South, East, West, London", "Student, Professional, Social, Supported, Mixed", "Tier 1 to Tier 5"], a: 0, why: "Five lenses on one framework. Most investors use three or four over a portfolio's life." },
        { q: "Which question should every client conversation answer first?", o: ["Which tier is the HMO in today, and which will it hold?", "How quickly can it go on Rightmove?", "What did the neighbour sell for?", "Can the client afford our fee?"], a: 0, why: "The five questions start with the tier today and the tier over the hold period." }
      ]
    },

    /* ------------------------------------------------------------------ 2 */
    {
      id: "what-is-hmo",
      title: "What is an HMO?",
      mins: 15,
      summary: "The legal definition, licensing, room sizes, planning classes and why investors buy HMOs.",
      sections: [
        { h: "The legal definition", p: [
          "Under the Housing Act 2004, a house in multiple occupation is a property let to 3 or more people who form 2 or more households and share facilities such as a kitchen, bathroom or toilet.",
          "A household is a single person, or members of the same family living together, including couples. Three friends sharing are three households. A couple sharing with one friend are two households and three people, so that is an HMO."
        ]},
        { h: "Licensing", list: [
          "Mandatory licensing: an HMO with 5 or more people forming 2 or more households needs a licence, whatever the number of storeys.",
          "Additional licensing: a council can require smaller HMOs (often 3 or 4 occupants) in all or part of its area to be licensed.",
          "Selective licensing: a council can require every privately rented home in an area to be licensed.",
          "Licences usually run for 5 years, carry conditions (occupancy, room sizes, amenities, a named manager) and typically cost £600 to £1,500 or more.",
          "Licences are not transferable. A buyer must apply for a new licence on completion, with a new fit and proper test."
        ]},
        { h: "Minimum room sizes (licensed HMOs)", table: { head: ["Sleeping room for", "Minimum floor area"], rows: [
          ["One person over 10", "6.51 sqm"], ["Two people over 10", "10.22 sqm"], ["One child under 10", "4.64 sqm"], ["Anyone", "A room under 4.64 sqm cannot be used for sleeping"]
        ]}, p: ["These are legal minimums. Councils can set higher standards; amenities are typically one bathroom and one WC per five people. The Tier Methodology expects much more: a Tier 2 HMO averages around 10 sqm or more a room."] },
        { h: "Planning use classes", terms: [
          ["C3", "A dwellinghouse: a family home or a let to one household."],
          ["C4", "A small HMO: 3 to 6 unrelated people sharing. Changing from C3 to C4 is permitted development, unless an Article 4 direction removes that right."],
          ["Sui generis", "A large HMO: 7 or more people. It always needs planning permission. “The seventh occupant is the universal stop.”"],
          ["Article 4 direction", "A council order removing the C3 to C4 permitted development right, so a new small HMO needs planning permission. Existing lawful HMOs keep their use (grandfather rights)."],
          ["LDC", "A Lawful Development Certificate (section 191) confirms an existing use is lawful: either the HMO use began before the Article 4 direction, or it has run for 10 years continuously with no enforcement. It takes 8 to 12 weeks, sometimes longer."],
          ["Section 257 HMO", "A building converted into self-contained flats that does not meet the 1991 Building Regulations, where fewer than two-thirds are owner-occupied."]
        ]},
        { h: "A licence is not planning", p: [
          "A licence says a property is safe to occupy as an HMO. It does not prove the use is lawful in planning terms. Buyers' solicitors and lenders ask both questions, and lenders increasingly want the LDC itself. Care use is C2, not C4."
        ]},
        { h: "The HMOs in our market", list: [
          "Tenant markets: professional, working, student, social or supported, and mixed. Professional, student and supported HMOs are “three different businesses”.",
          "Property types: terraced, semi-detached, detached and commercial conversions.",
          "Layout: shared bathrooms, part en-suite or all en-suite. Room size, bathrooms, condition, location and management set the tier."
        ]},
        { h: "Why investors buy HMOs", p: [
          "Rent is charged per room, so an HMO earns a much higher return than the same house let to one household: as a rule of thumb, around 7% to 9% net against 2% to 3% for a typical buy-to-let. The trade-off is more regulation, more management and more ways for income to slip. That is why the tier and the evidence matter.",
          "HMO X's first buying test: an HMO must out-invest a local buy-to-let on a net basis, or it is not worth the extra work."
        ]}
      ],
      questions: [
        { q: "What is the minimum for a property to be an HMO?", o: ["3 or more people forming 2 or more households, sharing facilities", "2 unrelated people sharing a kitchen", "5 or more people of any household", "Any house with more than 4 bedrooms"], a: 0, why: "Housing Act 2004: 3+ people, 2+ households, sharing facilities." },
        { q: "When does mandatory HMO licensing apply?", o: ["5 or more people forming 2 or more households", "3 or more people in any house", "7 or more people over three storeys", "Only where there is an Article 4 direction"], a: 0, why: "Mandatory licensing covers 5+ people in 2+ households, whatever the storeys." },

<script>
(function(){
'use strict';
const C = window.HMOX_COURSE, M = C.modules, DAY = 864e5;
const app = document.getElementById('app');
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDate = t => t ? new Date(t).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}) : '';
const pct = x => Math.round(x*100) + '%';

/* ---------- state ---------- */
const S = {
  db:null, user:null, me:null, canEdit:false, online:false, loading:true,
  progress:{modules:{}, history:[], declaration:null},
  signoff:null,
  team:{progress:{}, signoffs:{}, profiles:{}},
  quiz:null, // {id, items:[{qi, order}], answers:{}, done:false, score}
};
const LS = 'hmox-academy-local';
try { const v = JSON.parse(localStorage.getItem(LS) || 'null'); if (v && v.modules) S.progress = v; } catch(e){}

/* ---------- training cycle logic ---------- */
function cycle(prog, so){
  const recs = (so && so.records) || [], last = recs[recs.length-1] || null;
  const req = so && so.refresherRequestedAt || 0;
  let kind, start = 0, current = false, validUntil = null;
  if (!last) kind = 'induction';
  else if (req > last.at || Date.now() - last.at > C.refreshDays*DAY) { kind = 'refresher'; start = last.at; }
  else { kind = 'complete'; current = true; validUntil = last.at + C.refreshDays*DAY; }
  const done = id => { const m = prog.modules[id]; return !!(m && m.passedAt && m.passedAt > start); };
  const passed = M.filter(m => done(m.id)).length;
  const declared = !!(prog.declaration && prog.declaration.at > start);
  return {kind, start, last, current, validUntil, done, passed, all: passed === M.length, declared, ready: kind !== 'complete' && passed === M.length && declared};
}
function modStatus(id, cyc, prog){
  const m = prog.modules[id];
  if (cyc.kind === 'complete') return {cls:'good', text:'Signed off'};
  if (cyc.done(id)) return {cls:'good', text:'Passed ' + pct(m.best)};
  if (cyc.kind === 'refresher' && m && m.passedAt) return {cls:'warn', text:'Refresher due'};
  if (m && m.attempts) return {cls:'bad', text:'Not passed yet'};
  return {cls:'', text:'Not started'};
}

/* ---------- saving ---------- */
let saving = Promise.resolve();
function saveProgress(){
  S.progress.updatedAt = Date.now();
  try { localStorage.setItem(LS, JSON.stringify(S.progress)); } catch(e){}
  if (!S.db || !S.me) return;
  const snapshot = JSON.parse(JSON.stringify(S.progress));
  saving = saving.then(() => S.db.doc('progress/' + S.me).set(snapshot)).catch(e => toast('Your progress could not be saved: ' + (e && e.message || 'try again'), true));
}
let toastT;
function toast(msg, bad){
  let el = document.getElementById('toast');
  if (!el){ el = document.createElement('div'); el.id='toast'; el.setAttribute('role','status');
    el.style.cssText='position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));max-width:calc(100% - 32px);padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;z-index:20;box-shadow:0 6px 24px rgba(0,0,0,.18)';
    document.body.appendChild(el); }
  el.style.background = bad ? 'var(--bad)' : 'var(--ink)'; el.style.color = 'var(--bg)';
  el.textContent = msg; el.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => el.hidden = true, 3200);
}

/* ---------- routing ---------- */
function route(){
  const h = location.hash.replace('#','');
  document.getElementById('tabTeam').hidden = !S.canEdit;
  const onTeam = h === 'team' && S.canEdit;
  document.getElementById('tabMine').toggleAttribute('aria-current', !onTeam); if(!onTeam) document.getElementById('tabMine').setAttribute('aria-current','page');
  document.getElementById('tabTeam').toggleAttribute('aria-current', onTeam); if(onTeam) document.getElementById('tabTeam').setAttribute('aria-current','page');
  if (h.startsWith('m-')) { const mod = M.find(m => 'm-' + m.id === h); if (mod) return renderModule(mod); }
  if (onTeam) return renderTeam();
  renderHome();
}
window.addEventListener('hashchange', () => { S.quiz = null; route(); window.scrollTo(0,0); });

/* ---------- home ---------- */
function renderHome(){
  const cyc = cycle(S.progress, S.signoff);
  const meter = M.map(m => '<i class="' + (cyc.done(m.id) || cyc.kind==='complete' ? 'on' : '') + '"></i>').join('');
  const title = cyc.kind === 'complete' ? 'You are signed off' : cyc.kind === 'refresher' ? 'Your annual refresher' : 'Your HMO X induction';
  const lead = cyc.kind === 'complete'
    ? 'Your training is current until ' + fmtDate(cyc.validUntil) + '. You can revisit any module or retake a quiz to practise.'
    : cyc.passed + ' of ' + M.length + ' modules passed. Read each module, then pass its quiz with ' + pct(C.passMark) + ' or more.';
  const steps = [
    {t:'Pass all ' + M.length + ' quizzes', d: cyc.passed + ' of ' + M.length, s: cyc.all || cyc.current ? 'done' : 'now'},
    {t:'Sign your declaration', d: cyc.declared || cyc.current ? 'Signed' : 'After the quizzes', s: cyc.declared || cyc.current ? 'done' : cyc.all ? 'now' : ''},
    {t:'Manager sign-off', d: cyc.current ? 'Signed off ' + fmtDate(cyc.last.at) : cyc.ready ? 'Waiting for your manager' : 'Last step', s: cyc.current ? 'done' : cyc.ready ? 'now' : ''}
  ];
  let h = '';
  if (!S.online && !S.loading) h += '<p class="notice">Progress on this page is saved in this browser only. Open the shared HMO X Academy link while signed in to record results for sign-off.</p>';
  h += '<section class="summary"><div class="eyebrow">' + (cyc.kind === 'refresher' ? 'Refresher' : 'Induction') + '</div><h1>' + title + '</h1><p class="muted">' + lead + '</p><div class="meter" aria-hidden="true">' + meter + '</div>'
     + '<ol class="steps">' + steps.map(s => '<li class="' + s.s + '"><b>' + s.t + '</b>' + esc(s.d) + '</li>').join('') + '</ol></section>';
  if (cyc.current) h += certHTML(cyc);
  else if (cyc.all) h += declareHTML(cyc);
  h += '<section class="team"><h2 style="font-size:22px">Modules</h2><ul class="mods">' + M.map((m,i) => {
    const st = modStatus(m.id, cyc, S.progress);
    return '<li><a href="#m-' + m.id + '"><span class="n">' + String(i+1).padStart(2,'0') + '</span><span class="txt"><span class="t">' + esc(m.title) + '</span><span class="s">' + esc(m.summary) + ' · ' + m.mins + ' min</span></span><span class="chip ' + st.cls + '">' + st.text + '</span></a></li>';
  }).join('') + '</ul></section>';
  app.innerHTML = h;
  const f = document.getElementById('declForm');
  if (f) f.addEventListener('submit', e => {
    e.preventDefault();
    const name = document.getElementById('declName').value.trim();
    if (!name) { toast('Type your full name to sign', true); return; }
    S.progress.declaration = {at: Date.now(), name};
    saveProgress(); toast('Declaration signed'); renderHome();
  });
}
function declareHTML(cyc){
  if (cyc.declared) return '<section class="declare"><div class="eyebrow">Declaration signed</div><p>You signed on ' + fmtDate(S.progress.declaration.at) + ' as <b>' + esc(S.progress.declaration.name) + '</b>. Your manager will review your results and sign you off.</p>' + (S.online ? '' : '<p class="small muted">This browser is not connected to the shared record, so your manager cannot see it yet.</p>') + '</section>';
  return '<form class="declare" id="declForm"><div class="eyebrow">Last step for you</div><h2 style="font-size:22px">Sign your declaration</h2>'
    + '<p>I confirm I have read all ' + M.length + ' modules of the HMO X ' + (cyc.kind === 'refresher' ? 'refresher' : 'induction') + ', passed each quiz myself, and will follow the HMO X rules on evidence, compliance and confidentiality in my work.</p>'
    + '<label for="declName">Your full name<input type="text" id="declName" autocomplete="name" maxlength="80"></label>'
    + '<div class="cta"><button class="btn teal" type="submit">Sign declaration</button></div></form>';
}
function certHTML(cyc){
  const by = S.team.profiles[cyc.last.by];
  return '<section class="cert"><div class="eyebrow">Certificate of completion</div><h2>HMO X ' + (cyc.last.kind === 'refresher' ? 'Training Refresher' : 'Induction') + '</h2>'
    + '<p><b>' + esc(S.progress.declaration ? S.progress.declaration.name : '') + '</b> passed all ' + M.length + ' modules and was signed off on <b>' + fmtDate(cyc.last.at) + '</b>' + (by && by.name ? ' by <b>' + esc(by.name) + '</b>' : '') + '.</p>'
    + (cyc.last.note ? '<p>“' + esc(cyc.last.note) + '”</p>' : '')
    + '<p>Valid until ' + fmtDate(cyc.validUntil) + '. HMO X Ltd · Your community of HMO experts.</p></section>';
}

/* ---------- module + quiz ---------- */
function sectionHTML(s){
  let h = '<section class="sec"><h2>' + esc(s.h) + '</h2>';
  (s.p || []).forEach(p => h += '<p>' + esc(p) + '</p>');
  if (s.list) h += '<ul>' + s.list.map(x => '<li>' + esc(x) + '</li>').join('') + '</ul>';
  if (s.terms) h += '<dl class="terms">' + s.terms.map(t => '<div><dt>' + esc(t[0]) + '</dt><dd>' + esc(t[1]) + '</dd></div>').join('') + '</dl>';
  if (s.cards) h += '<div class="cards">' + s.cards.map(c => '<div class="card"><b>' + esc(c.name) + '</b><span class="role">' + esc(c.role) + '</span><span class="small muted">' + esc(c.text) + '</span></div>').join('') + '</div>';
  if (s.table) h += '<div class="tbl"><table><thead><tr>' + s.table.head.map(x => '<th>' + esc(x) + '</th>').join('') + '</tr></thead><tbody>' + s.table.rows.map(r => '<tr>' + r.map(x => '<td>' + esc(x) + '</td>').join('') + '</tr>').join('') + '</tbody></table></div>';
  return h + '</section>';
}
const shuffle = a => { a = a.slice(); for (let i = a.length-1; i > 0; i--) { const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; } return a; };
function startQuiz(mod){
  S.quiz = {id: mod.id, items: shuffle(mod.questions.map((q,i) => i)).map(qi => ({qi, order: shuffle(mod.questions[qi].o.map((o,i) => i))})), answers:{}, done:false};
  renderModule(mod, true);
}
function renderModule(mod, scrollToQuiz){
  const i = M.indexOf(mod), cyc = cycle(S.progress, S.signoff), st = modStatus(mod.id, cyc, S.progress), rec = S.progress.modules[mod.id];
  let h = '<article class="lesson"><header><a class="back" href="#">← All modules</a><div class="eyebrow">Module ' + (i+1) + ' of ' + M.length + ' · ' + mod.mins + ' min</div><h1>' + esc(mod.title) + '</h1><p class="muted">' + esc(mod.summary) + '</p>'
    + '<div class="row"><span class="chip ' + st.cls + '">' + st.text + '</span>' + (rec && rec.attempts ? '<span class="small muted">' + rec.attempts + ' attempt' + (rec.attempts > 1 ? 's' : '') + ', best ' + pct(rec.best) + '</span>' : '') + '</div></header>';
  if (S.canEdit && mod.confirm) h += '<p class="confirm"><b>Manager note: content to add.</b> ' + esc(mod.confirm) + ' <span class="muted">Only Editors see this.</span></p>';
  h += mod.sections.map(sectionHTML).join('');
  h += '<section class="quiz" id="quiz">' + quizHTML(mod) + '</section></article>';
  app.innerHTML = h;
  bindQuiz(mod);
  if (scrollToQuiz) document.getElementById('quiz').scrollIntoView({block:'start'});
}
function quizHTML(mod){
  const n = mod.questions.length, need = Math.ceil(n * C.passMark - 1e-9);
  const Q = S.quiz && S.quiz.id === mod.id ? S.quiz : null;
  if (!Q) return '<div class="eyebrow">Quiz</div><h2>Check your understanding</h2><p class="muted">' + n + ' multiple choice questions. Get ' + need + ' or more right to pass. The questions and answers are shuffled each time.</p><div class="cta"><button class="btn teal" id="qStart" type="button">Start the quiz</button></div>';
  let h = '<div class="eyebrow">Quiz · ' + n + ' questions</div><h2>' + esc(mod.title) + '</h2>';
  if (Q.done) {
    const pass = Q.score >= C.passMark;
    h += '<div class="result ' + (pass ? 'pass' : 'fail') + '"><h3>' + (pass ? 'Passed' : 'Not passed yet') + ': ' + Q.right + ' of ' + n + ' (' + pct(Q.score) + ')</h3><p class="muted">' + (pass ? 'This module is recorded as passed.' : 'You need ' + need + ' of ' + n + '. Read the explanations below, then try again.') + '</p></div>';
  }
  h += '<form id="qForm" style="display:grid;gap:18px">' + Q.items.map((it, k) => {
    const q = mod.questions[it.qi], chosen = Q.answers[k];
    return '<fieldset class="q"><legend><span>' + (k+1) + '.</span>' + esc(q.q) + '</legend>' + it.order.map(oi => {
      let cls = 'opt';
      if (Q.done) { if (oi === q.a) cls += ' right'; else if (oi === chosen) cls += ' wrong'; }
      const id = 'q' + k + 'o' + oi;
      return '<label class="' + cls + '" for="' + id + '"><input type="radio" name="q' + k + '" id="' + id + '" value="' + oi + '"' + (chosen === oi ? ' checked' : '') + (Q.done ? ' disabled' : '') + '><span>' + esc(q.o[oi]) + '</span></label>';
    }).join('') + (Q.done ? '<p class="why"><b>' + (chosen === q.a ? 'Correct.' : 'The answer: ' + esc(q.o[q.a]) + '.') + '</b> ' + esc(q.why) + '</p>' : '') + '</fieldset>';
  }).join('');
  h += '<div class="cta">' + (Q.done ? '<button class="btn teal" type="button" id="qAgain">Take it again</button><a class="btn ghost" href="#" style="text-decoration:none">Back to modules</a>' + nextLink(mod)
                                     : '<button class="btn teal" type="submit" id="qSubmit">Submit answers</button><span class="small muted" id="qLeft"></span>') + '</div></form>';
  return h;
}
function nextLink(mod){ const nx = M[M.indexOf(mod)+1]; return nx ? '<a class="btn" href="#m-' + nx.id + '" style="text-decoration:none">Next module</a>' : ''; }
function bindQuiz(mod){
  const start = document.getElementById('qStart'); if (start) start.onclick = () => startQuiz(mod);
  const again = document.getElementById('qAgain'); if (again) again.onclick = () => startQuiz(mod);
  const form = document.getElementById('qForm'); if (!form || S.quiz.done) return;
  const left = () => { const n = S.quiz.items.length - Object.keys(S.quiz.answers).length; document.getElementById('qLeft').textContent = n ? n + ' still to answer' : ''; };
  form.addEventListener('change', e => { const m = e.target.name.match(/^q(\d+)$/); if (m) S.quiz.answers[+m[1]] = +e.target.value; left(); });
  form.addEventListener('submit', e => {
    e.preventDefault();
    const Q = S.quiz; if (Object.keys(Q.answers).length < Q.items.length) { left(); toast('Answer every question first', true); return; }
    Q.right = Q.items.reduce((s, it, k) => s + (Q.answers[k] === mod.questions[it.qi].a ? 1 : 0), 0);
    Q.score = Q.right / Q.items.length; Q.done = true;
    record(mod.id, Q.score);
    renderModule(mod, true);
  });
}
function record(id, score){
  const now = Date.now(), m = S.progress.modules[id] || {attempts:0, best:0};
  m.attempts = (m.attempts || 0) + 1; m.last = score; m.lastAt = now;
  if (score >= C.passMark) { m.passedAt = now; m.best = Math.max(m.best || 0, score); }
  else m.best = Math.max(m.best || 0, score);
  S.progress.modules[id] = m;
  S.progress.history = (S.progress.history || []).concat({m:id, s:Math.round(score*1000)/1000, at:now}).slice(-200);
  saveProgress();
  if (score >= C.passMark) toast('Module passed');
}

/* ---------- team sign-off (Editors) ---------- */
let teamSubs = false, signFor = null;
function subscribeTeam(){
  if (teamSubs || !S.db || !S.canEdit) return; teamSubs = true;
  S.db.collection('progress').onSnapshot(snap => { const o = {}; snap.docs.forEach(d => o[d.id] = d.data()); S.team.progress = o; loadProfiles(); if (location.hash === '#team') renderTeam(); }, () => {});
  S.db.collection('signoffs').onSnapshot(snap => { const o = {}; snap.docs.forEach(d => o[d.id] = d.data()); S.team.signoffs = o; loadProfiles(); if (location.hash === '#team') renderTeam(); }, () => {});
}
async function loadProfiles(){
  if (!S.user) return;
  const ids = new Set(Object.keys(S.team.progress));
  Object.values(S.team.signoffs).forEach(so => (so.records || []).forEach(r => r.by && ids.add(r.by)));
  (S.signoff && S.signoff.records || []).forEach(r => r.by && ids.add(r.by));
  if (!ids.size) return;
  try { S.team.profiles = await S.user.profiles([...ids]); } catch(e) {}
  route();
}
function renderTeam(){
  const ids = Object.keys(S.team.progress);
  let h = '<section class="summary"><div class="eyebrow">Managers</div><h1>Team sign-off</h1><p class="muted">Everyone who has started training, with their quiz results. Learners write their own results; only they can change them. You sign off once someone has passed every module and signed their declaration. Sign-off lasts ' + C.refreshDays + ' days, then the refresher starts.</p></section>';
  if (!S.online) h += '<p class="notice">Team results appear when this page is open from the shared link while signed in.</p>';
  else if (!ids.length) h += '<p class="notice">No one has started yet. Share this page with your team as Contributors (so they can save their results), and their progress will appear here as they take quizzes.</p>';
  const order = ids.map(id => ({id, p:S.team.progress[id], so:S.team.signoffs[id], cyc:cycle(S.team.progress[id], S.team.signoffs[id])}))
    .sort((a,b) => (b.cyc.ready - a.cyc.ready) || (a.cyc.passed - b.cyc.passed));
  h += '<div class="team">' + order.map(personHTML).join('') + '</div>';
  app.innerHTML = h;
  app.querySelectorAll('[data-sign]').forEach(b => b.onclick = () => { signFor = b.dataset.sign; renderTeam(); const t = document.getElementById('signNote'); if (t) t.focus(); });
  app.querySelectorAll('[data-cancel]').forEach(b => b.onclick = () => { signFor = null; renderTeam(); });
  app.querySelectorAll('[data-confirm]').forEach(b => b.onclick = () => signOff(b.dataset.confirm));
  app.querySelectorAll('[data-refresh]').forEach(b => b.onclick = () => requestRefresher(b.dataset.refresh));
}
function personHTML(x){
  const pr = S.team.profiles[x.id] || {}, name = pr.name || (x.p.declaration && x.p.declaration.name) || 'Team member', c = x.cyc;
  const state = c.current ? {cls:'good', t:'Signed off to ' + fmtDate(c.validUntil)} : c.ready ? {cls:'ink', t:'Ready for sign-off'} : c.kind === 'refresher' ? {cls:'warn', t:'Refresher: ' + c.passed + '/' + M.length} : {cls:'', t:'Induction: ' + c.passed + '/' + M.length};
  let h = '<div class="person"><div class="person-hd"><div class="who">' + (pr.avatarUrl && /^https:\/\//.test(pr.avatarUrl) ? '<img class="av" alt="" src="' + esc(pr.avatarUrl) + '">' : '<span class="av"></span>') + '<div><b>' + esc(name) + '</b><span class="small muted">Last activity ' + fmtDate(x.p.updatedAt) + (x.p.declaration && x.p.declaration.at > c.start ? ' · declaration signed ' + fmtDate(x.p.declaration.at) : '') + '</span></div></div><span class="chip ' + state.cls + '">' + state.t + '</span></div>';
  h += '<div class="grid12">' + M.map((m,i) => { const r = x.p.modules[m.id]; const ok = c.done(m.id) || c.current; return '<div class="cell ' + (ok ? 'ok' : r && r.attempts ? 'no' : '') + '" title="' + esc(m.title) + '"><span>' + (i+1) + '. ' + esc(m.title) + '</span><span>' + (r && r.attempts ? pct(r.best) : '–') + '</span></div>'; }).join('') + '</div>';
  const recs = (x.so && x.so.records) || [];
  if (recs.length) h += '<p class="small muted">History: ' + recs.map(r => { const b = S.team.profiles[r.by]; return (r.kind === 'refresher' ? 'Refresher' : 'Induction') + ' signed off ' + fmtDate(r.at) + (b && b.name ? ' by ' + esc(b.name) : ''); }).join('; ') + '</p>';
  if (x.id === S.me) h += '<p class="small muted">This is you. Someone else should sign off your own training.</p>';
  else if (c.ready) {
    h += signFor === x.id
      ? '<div class="signbox"><label class="small" for="signNote"><b>Sign-off note (optional)</b></label><textarea id="signNote" rows="2" maxlength="300" placeholder="For example: discussed modules 5 and 8 in our 1:1"></textarea><div class="row"><button class="btn teal" type="button" data-confirm="' + esc(x.id) + '">Confirm sign-off</button><button class="btn ghost" type="button" data-cancel="1">Cancel</button></div></div>'
      : '<div class="row"><button class="btn teal" type="button" data-sign="' + esc(x.id) + '">Sign off ' + (c.kind === 'refresher' ? 'refresher' : 'induction') + '</button></div>';
  } else if (c.current) h += '<div class="row"><button class="btn ghost" type="button" data-refresh="' + esc(x.id) + '">Start refresher now</button><span class="small muted">Otherwise it starts on ' + fmtDate(c.validUntil) + '.</span></div>';
  return h + '</div>';
}
async function signOff(uid){
  const p = S.team.progress[uid], so = S.team.signoffs[uid] || {records:[]}, c = cycle(p, so);
  if (!c.ready) return;
  const noteEl = document.getElementById('signNote');
  const scores = {}; M.forEach(m => scores[m.id] = Math.round((p.modules[m.id] || {}).best * 1000) / 1000 || 0);
  const next = {records: (so.records || []).concat({at: Date.now(), by: S.me, kind: c.kind, note: noteEl ? noteEl.value.trim().slice(0,300) : '', scores}), refresherRequestedAt: so.refresherRequestedAt || 0};
  try { await S.db.doc('signoffs/' + uid).set(next); signFor = null; toast('Signed off'); }
  catch(e){ toast('Sign-off was not saved: ' + (e && e.message || 'try again'), true); }
}
async function requestRefresher(uid){
  const so = S.team.signoffs[uid] || {records:[]};
  try { await S.db.doc('signoffs/' + uid).set({records: so.records || [], refresherRequestedAt: Date.now()}); toast('Refresher started'); }
  catch(e){ toast('Could not start the refresher: ' + (e && e.message || 'try again'), true); }
}

/* ---------- connect ---------- */
route();
(async function connect(){
  const timer = setTimeout(() => { S.loading = false; route(); }, 10000);
  try {
    if (!window.claude || !window.claude.use) throw 0;
    const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
    S.user = user;
    if (!db || !user) throw 0;
    S.db = db; S.me = await user.id();
    S.canEdit = !!(await user.canEdit());
    S.online = true;
    let first = true;
    db.doc('progress/' + S.me).onSnapshot(snap => {
      clearTimeout(timer); S.loading = false;
      if (snap.exists) S.progress = Object.assign({modules:{}, history:[], declaration:null}, snap.data());
      else if (first && Object.keys(S.progress.modules).length) saveProgress(); // carry over anything done before connecting
      first = false;
      if (!S.quiz) route(); else if (location.hash.startsWith('#m-')) {/* keep the open quiz */}
    }, () => { S.online = false; S.loading = false; route(); });
    db.doc('signoffs/' + S.me).onSnapshot(snap => { S.signoff = snap.exists ? snap.data() : null; loadProfiles(); if (!S.quiz) route(); }, () => {});
    subscribeTeam();
  } catch(e) { clearTimeout(timer); S.loading = false; route(); }
})();
})();
</script>
